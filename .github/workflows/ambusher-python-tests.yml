name: Ambusher Python AI

on:
  push:
    paths:
      - "PythonAI/**"
      - "pyproject.toml"
      - ".github/workflows/ambusher-python-tests.yml"
  pull_request:
    paths:
      - "PythonAI/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest

